# CI de Nível 02 - Execução Agendada

#nome da pipe
name: 'CI - Execução Agendada'

# gatilhos / triggers -> regras de disparo
# gatinho agendado = schedule
on:
  schedule:
    #cronograma de execução
    # minutos, hora, dia do mês, mês, dia da semana
    # de segunda a sexta 1-5, sabado e domingo 0,6
    # horarios diferentes por dia  da semana add um cron por dia da semana
    # 0 - domingo, 6 - sábado
    #- cron: '*/8 * * * *' #meia-noite, domingo
    

#tarefas executadas dentro da pipe
jobs:
  #nome do job
  e2e-tests:
    #maquina onde o job vai rodar
    runs-on: ubuntu-latest #git que vai disponibilizar a máquina virtual
    #passos do job
    steps:
      #clone do projeto
      - uses: actions/checkout@v4

      #instalação do node
      - uses: actions/setup-node@v4
        with:
          node-version: 24.x

      #instalação do yarn
      - name: Instalando do Yarn
        run: npm install -g yarn

      #instalação das dependências
      - name: Instalando dependências
        run: yarn

      #instalação dos Browser do Playwright
      - name: Instalando os Browsers do Playwright
        run: npx playwright install

      #execução dos testes
      - name: Executando os testes
        run: yarn run e2e

      #notificação discord
      - name: Notificando o Discord
        if: always()
        uses: Ilshidur/action-discord@master
        env:
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
        with:
          args: 'Pipeline concluída. Status: ${{ job.status }}'



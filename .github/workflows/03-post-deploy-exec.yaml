# CI de Nível 03 - Disparo após a conclusão de outra pipeline

#nome da pipe
name: 'CI - Execução por Deploy'

# gatilhos / triggers -> regras de disparo
# gatilho por conclusão de outra pipeline - workflow_run

on:
  workflow_run:
    workflows: ['CI - Manual Execução', 'CI - Execução Agendada']
    types:
      - completed

#tarefas executadas dentro da pipe
jobs:
  #nome do job
  e2e-tests:
    #maquina onde o job vai rodar
    runs-on: ubuntu-latest #git que vai disponibilizar a máquina virtual
    #validar se a pipeline anterior foi bem sucedida
    if: ${{ github.event.workflow_run.conclusion == 'success' }}

    #passos do job
    steps:
      #clone do projeto
      - uses: actions/checkout@v4

      #instalação do node
      - uses: actions/setup-node@v4
        with:
          node-version: 24.x

      #instalação do yarn
      - name: Instalando do Yarn
        run: npm install -g yarn

      #instalação das dependências
      - name: Instalando dependências
        run: yarn

      #instalação dos Browser do Playwright
      - name: Instalando os Browsers do Playwright
        run: npx playwright install

      #execução dos testes
      - name: Executando os testes
        run: yarn run e2e

      #notificação discord
      - name: Notificando o Discord
        if: always()
        uses: Ilshidur/action-discord@master
        env:
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
        with:
          args: 'Pipeline concluída. Status: ${{ job.status }}'



#nome da pipe
name: 'CI - SELF-HOSTED - Manual Execução'

# gatilhos / triggers -> regras de disparo
# gatinho manual = workflow_dispatch
on:
  workflow_dispatch:

#tarefas executadas dentro da pipe
jobs:
  #nome do job
  e2e-tests:
    #maquina onde o job vai rodar
    runs-on: self-hosted
    #passos do job
    steps:
      #clone do projeto
      - uses: actions/checkout@v4

      #instalação do node
      - uses: actions/setup-node@v4
        with:
          node-version: 24.x

      #instalação do yarn
      - name: Instalando do Yarn
        run: npm install -g yarn

      #instalação das dependências
      - name: Instalando dependências
        run: yarn

      #instalação dos Browser do Playwright
      - name: Instalando os Browsers do Playwright
        run: npx playwright install

      #execução dos testes
      - name: Executando os testes
        run: yarn run e2e

      

